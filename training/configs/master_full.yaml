# Syon Master Training — Programação + Cybersecurity + Arquitetura (Senior/Master)
# Requer: GPU 24GB+ (QLoRA) ou multi-GPU para 7B+

model:
  base_model: meta-llama/Llama-2-7b-hf  # troque por checkpoint Syon quando disponível
  # Kaggle/T4: use TinyLlama/TinyLlama-1.1B-Chat-v1.0
  max_seq_length: 2048
  use_lora: true
  use_4bit: true
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, v_proj, k_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  weight_decay: 0.01
  save_every_steps: 1000
  max_epochs: 200
  checkpoint_dir: training/checkpoints
  mixed_precision: true

loss:
  security_aware_weight: 0.15
  contrastive_weight: 0.1

phases:
  - name: phase1_foundation
    description: "Programação sólida + fundamentos + patterns"
    max_steps: 50000
    learning_rate: 2.0e-5
    security_aware_weight: 0.10
    focus_domains: [programming, complementary]
    checkpoint_subdir: phase1

  - name: phase2_security_mastery
    description: "Cybersecurity senior — OWASP, threat modeling, compliance"
    max_steps: 25000
    learning_rate: 1.0e-5
    security_aware_weight: 0.25
    focus_domains: [cybersecurity, training_quality]
    checkpoint_subdir: phase2

  - name: phase3_architecture_mastery
    description: "System design + arquitetura distribuída master"
    max_steps: 25000
    learning_rate: 1.0e-5
    security_aware_weight: 0.15
    focus_domains: [complementary, programming, training_quality]
    checkpoint_subdir: phase3

output:
  pretrained_dir: models/pretrained/syon-master-lora
  summary: training/logs/master_summary.json

data:
  raw_dir: data/raw
  processed_dir: data/processed
  curriculum: data/curriculum/master_curriculum.yaml
  composition: configs/dataset/composition.yaml
  # Para nível master real: adicione datasets externos (The Stack, OWASP, CVE)
  external_sources:
    - name: the-stack-smol
      url: "https://huggingface.co/datasets/bigcode/the-stack-smol"
      domain: programming
    - name: cve-records
      note: "Importar NVD JSON feeds para cybersecurity/cve_nvd"