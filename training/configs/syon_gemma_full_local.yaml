# Syon + Gemma 2 — treino FULL local (programação + cybersecurity)
model_params:
  base_model: google/gemma-2-2b-it
  max_seq_length: 1024
  use_lora: true
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

phases:
  - name: phase1_programming_full
    max_steps: 600
    learning_rate: 1.5e-4
    focus_domains: [programming]
    description: "Programação completa"

  - name: phase2_cybersecurity_full
    max_steps: 600
    learning_rate: 1.2e-4
    focus_domains: [cybersecurity]
    description: "Cybersecurity completa"

  - name: phase3_complementary_arch
    max_steps: 400
    learning_rate: 1.0e-4
    focus_domains: [complementary, training_quality]
    description: "Arquitetura + qualidade"

  - name: phase4_unified_dialogue
    max_steps: 400
    learning_rate: 8.0e-5
    focus_domains: []
    description: "Diálogo unificado PT + raciocínio"

  - name: phase5_conversation_full
    max_steps: 500
    learning_rate: 6.0e-5
    focus_domains: [conversation]
    description: "Fala, conversação e compreensão em português"

training_params:
  batch_size: 1
  gradient_accumulation_steps: 8
  save_every_steps: 100
  num_epochs: 100

data:
  sft_dir: data/gemma_sft
  raw_dir: data/raw
  min_curriculum: 10000
  min_conversation: 5000
  conversation_sources:
    - nicholasKluge/instruct-aira-dataset-v3
    - recogna-nlp/UltrachatBR

output_dir: models/pretrained/syon-gemma-full