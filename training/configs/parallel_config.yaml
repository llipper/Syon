# Configuração de treinamento paralelo (Parallel SFT)
extends: base_config.yaml

training_params:
  batch_size: 8
  max_steps: 100000
  distributed: true

distributed_params:
  world_size: 8
  rank: 0
  local_rank: 0
  backend: nccl
  master_addr: localhost
  master_port: 29500

loss:
  security_aware_weight: 0.15
  contrastive_weight: 0.1
  distillation_weight: 1.0

parallel:
  strategy: data_parallel
  gradient_sync: true