# Syon 3 — Kaggle (GPU) | HF só infraestrutura | modelo proprietário

model:
  architecture: syon3
  resume: /kaggle/working/syon/kl
  tokenizer_dir: /kaggle/working/syon/kl
  max_seq_length: 512

data:
  conversation_dir: /kaggle/working/syon/data/raw/conversation
  raw_dir: /kaggle/working/syon/data/raw
  max_conversation_samples: 100000
  max_reasoning_samples: 50000
  conversation_weight: 0.6
  reasoning_domains:
    - programming
    - cybersecurity
    - complementary
    - training_quality
  val_ratio: 0.02
  hf_dataset: nicholasKluge/instruct-aira-dataset-v3
  hf_split: portuguese

training:
  output_dir: /kaggle/working/syon-output/syon3_hf
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5
  max_steps: 3000
  warmup_steps: 100
  weight_decay: 0.01
  logging_steps: 25
  save_steps: 200
  eval_steps: 200
  save_total_limit: 2
  fp16: true
  report_to: none
  seed: 42

output:
  model_dir: /kaggle/working/syon-output/syon-3
  summary: /kaggle/working/syon-output/syon3_hf.json
  hub_repo: null