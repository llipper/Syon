# Otimizado para Kaggle GPU (T4 16GB / P100 16GB)
model_params:
  base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  hidden_size: 2048
  num_layers: 22
  max_seq_length: 512
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj

training_params:
  batch_size: 2
  learning_rate: 2.0e-4
  max_steps: 500
  warmup_steps: 50
  gradient_accumulation_steps: 8
  mixed_precision: true
  save_every_steps: 100
  eval_every_steps: 50
  num_epochs: 1

data_params:
  max_samples_per_domain: 500
  data_dir: /kaggle/working/syon/data/raw

loss:
  security_aware_weight: 0.15
  contrastive_weight: 0.05

checkpoint_dir: /kaggle/working/syon/training/checkpoints
log_dir: /kaggle/working/syon/training/logs
output_dir: /kaggle/working/syon-output