# Syon — Treinamento DO ZERO no Kaggle (arquitetura + tokenizer + pesos próprios)

model:
  from_scratch: true
  architecture: syon3
  vocab_size: 8192
  max_seq_length: 512
  tokenizer_dir: /kaggle/working/syon/models/tokenizer/syon3-bpe

pretrain:
  max_steps: 300
  learning_rate: 3.0e-4
  batch_size: 4
  gradient_accumulation_steps: 4
  save_every_steps: 50
  checkpoint_dir: /kaggle/working/syon/training/checkpoints/pretrain

training:
  batch_size: 4
  gradient_accumulation_steps: 4
  save_every_steps: 50
  max_epochs: 100
  checkpoint_dir: /kaggle/working/syon/training/checkpoints

data:
  min_samples: 5000
  raw_dir: /kaggle/working/syon/data/raw

phases:
  - name: phase1_foundation
    max_steps: 150
    learning_rate: 2.0e-4
    security_aware_weight: 0.10
    focus_domains: [programming, complementary]
    checkpoint_subdir: phase1

  - name: phase2_security_mastery
    max_steps: 150
    learning_rate: 1.0e-4
    security_aware_weight: 0.30
    focus_domains: [cybersecurity, training_quality]
    checkpoint_subdir: phase2

  - name: phase3_architecture_mastery
    max_steps: 150
    learning_rate: 1.0e-4
    security_aware_weight: 0.15
    focus_domains: [complementary, programming, training_quality]
    checkpoint_subdir: phase3

output:
  pretrain_dir: /kaggle/working/syon-output/syon-3-pretrain
  pretrained_dir: /kaggle/working/syon-output/syon-3
  summary: /kaggle/working/syon-output/syon-3_summary.json