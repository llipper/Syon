name: syon-base
version: "1.0.0-beta"
architecture:
  type: transformer
  hidden_size: 4096
  num_hidden_layers: 32
  num_attention_heads: 32
  intermediate_size: 11008
  vocab_size: 32000
  max_position_embeddings: 4096
  attention: flash_attention_v2
  position_encoding: rope
  activation: swiglu
  normalization: rmsnorm
training:
  learning_rate: 2.0e-4
  warmup_steps: 2000
  max_seq_length: 4096
  weight_decay: 0.01
  gradient_clip: 1.0
tokenizer:
  type: sentencepiece
  model_max_length: 4096
  special_tokens:
    - "<|system|>"
    - "<|user|>"
    - "<|assistant|>"
    - "<|code|>"
    - "<|security|>"