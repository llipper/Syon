name: syon-13b
version: "1.0.0-beta"
extends: base_model_config.yaml
architecture:
  parameters_billions: 13
  hidden_size: 5120
  num_hidden_layers: 40
  num_attention_heads: 40
  context_window: 8192
  quantization: fp16
training:
  learning_rate: 1.5e-4
  warmup_steps: 3000
  max_seq_length: 4096
  batch_size: 16
distribution:
  gguf: syon-13b.gguf
  gguf_size_gb: 8.5
  fp16: syon-13b-fp16.bin
  fp16_size_gb: 26