inference:
  mode: realtime
  default_model: syon-7b
  device: auto
  batch_size: 1
  temperature: 0.7
  top_p: 0.95
  max_tokens: 2048
  stream: true
  use_kv_cache: true
  use_flash_attention: true
latency_targets_ms:
  first_token: 50
  inference_512_tokens: 120
  code_generation_100_lines: 280
  security_analysis_1kb: 150
server:
  host: 0.0.0.0
  port: 8000
  workers: 2
  timeout_seconds: 120
  max_concurrent_requests: 32
optimization:
  use_quantization: false
  quantization_bits: 8
  use_cache: true
  cache_ttl_seconds: 300