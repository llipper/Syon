environment: kaggle
debug: true
log_level: INFO

paths:
  working: /kaggle/working
  input: /kaggle/input
  output: /kaggle/working/syon-output
  data_raw: /kaggle/working/syon/data/raw
  checkpoints: /kaggle/working/syon/training/checkpoints
  models: /kaggle/working/syon/models/pretrained

gpu:
  # T4 = 16GB | P100 = 16GB | 2x T4 disponível em alguns notebooks
  recommended_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  max_seq_length: 512
  batch_size: 2
  gradient_accumulation_steps: 8

training:
  max_steps: 500
  learning_rate: 2.0e-4
  save_every_steps: 100
  mixed_precision: true

kaggle:
  session_limit_hours: 12
  internet_required: true
  gpu_required: true