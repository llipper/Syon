training:
  method: parallel_supervised_sft
  algorithm: causal_language_modeling
  instruction_following: true
  optimizer:
    name: adamw
    learning_rate: 2.0e-4
    weight_decay: 0.01
    warm_restarts: true
  precision: mixed_fp16
  batch_size: 32
  gradient_accumulation: 4
  num_epochs: 3
  max_steps: 100000
  warmup_steps: 2000
  checkpoint_interval: 1000
  validation_interval: 500
  early_stopping_patience: 5
loss:
  primary: cross_entropy
  auxiliary:
    - security_aware
    - contrastive
  security_aware_weight: 0.15
  contrastive_weight: 0.1
data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  shuffle: true
  seed: 42
distributed:
  backend: nccl
  find_unused_parameters: false
callbacks:
  - checkpointing
  - validation
  - monitoring
  - wandb