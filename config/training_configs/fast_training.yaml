training:
  method: parallel_supervised_sft
  algorithm: causal_language_modeling
  instruction_following: true
  optimizer:
    name: adamw
    learning_rate: 3.0e-4
    weight_decay: 0.01
    warm_restarts: false
  precision: mixed_fp16
  batch_size: 8
  gradient_accumulation: 1
  num_epochs: 1
  max_steps: 1000
  warmup_steps: 100
  checkpoint_interval: 250
  validation_interval: 100
  early_stopping_patience: 2
loss:
  primary: cross_entropy
  auxiliary:
    - security_aware
  security_aware_weight: 0.1
data:
  train_split: 0.9
  val_split: 0.1
  test_split: 0.0
  shuffle: true
  seed: 42
  max_samples: 10000
distributed:
  backend: gloo
  world_size: 1
callbacks:
  - checkpointing
  - monitoring
description: Configuração rápida para testes e validação de pipeline