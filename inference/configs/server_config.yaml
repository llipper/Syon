server:
  host: 0.0.0.0
  port: 8080
  num_workers: 4
  timeout_seconds: 120
  max_requests_per_second: 50
  max_body_size_mb: 10

cors:
  enabled: true
  origins:
    - "*"

security:
  enable_input_validation: true
  enable_output_filtering: true
  require_api_key: false

logging:
  level: INFO
  format: json