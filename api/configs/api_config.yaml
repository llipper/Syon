server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  timeout: 120
  max_body_size: 10485760  # 10 MB
  cors_origins:
    - "*"

features:
  streaming: true
  security_analysis: true
  code_review: true
  websocket: false

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"