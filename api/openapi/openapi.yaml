openapi: 3.1.0
info:
  title: Syon API
  description: API REST para programação e cybersegurança
  version: 1.0.0b0
servers:
  - url: http://localhost:8000
    description: Development server
paths:
  /health:
    get:
      summary: Health check
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
  /v1/completions:
    post:
      summary: Create text completion
      tags: [completions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: Completion generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
  /v1/chat/completions:
    post:
      summary: Create chat completion
      tags: [chat]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat completion generated
  /v1/security-analysis:
    post:
      summary: Analyze code security
      tags: [security]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityAnalysisRequest"
      responses:
        "200":
          description: Security analysis result
  /v1/models:
    get:
      summary: List available models
      tags: [models]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of models
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CompletionRequest:
      type: object
      required: [prompt]
      properties:
        model:
          type: string
          default: syon-7b
        prompt:
          type: string
        max_tokens:
          type: integer
          default: 2048
        temperature:
          type: number
          default: 0.7
        top_p:
          type: number
          default: 0.95
    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
        usage:
          type: object
    ChatRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              content:
                type: string
    SecurityAnalysisRequest:
      type: object
      required: [code]
      properties:
        model:
          type: string
        code:
          type: string
        language:
          type: string
          default: python
        include_llm_analysis:
          type: boolean
          default: true