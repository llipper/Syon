apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: syon-api-hpa
  namespace: syon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: syon-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70