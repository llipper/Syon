apiVersion: apps/v1
kind: Deployment
metadata:
  name: syon-api
  namespace: syon
  labels:
    app: syon
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: syon
      component: api
  template:
    metadata:
      labels:
        app: syon
        component: api
    spec:
      containers:
        - name: syon-api
          image: syon:api-latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: syon-config
          env:
            - name: SYON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: syon-secrets
                  key: api-key
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 12Gi
          volumeMounts:
            - name: models
              mountPath: /models
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: syon-models-pvc